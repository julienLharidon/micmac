repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.0
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
-   repo: local
    hooks:
    -   id: lizard
        name: lizard
        entry: lizard -l python -C 10 -L 80 pymicmac/
        language: system
        pass_filenames: false
    -   id: mypy
        name: mypy
        entry: mypy pymicmac/
        language: system
        pass_filenames: false
    -   id: bandit
        name: bandit
        entry: bandit -r pymicmac/
        language: system
        pass_filenames: false
    -   id: pytest
        name: pytest
        entry: python3 -m pytest
        language: system
        pass_filenames: false
