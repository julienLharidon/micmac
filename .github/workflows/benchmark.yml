name: PyMicMac Continuous Benchmarking

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy opencv-python-headless

      - name: Run Benchmark
        run: |
          python bench/benchmark.py > bench/BENCHMARK_RESULTS.md

      - name: Commit results
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bench/BENCHMARK_RESULTS.md
          git commit -m "docs: update benchmark results [skip ci]" || echo "No changes to commit"
          git push
